name: Sync Shopee Product Covers

on:
  push:
    paths:
      - 'scripts/sync_shopee_images.py'
      - '.github/workflows/sync-shopee-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pillow
      - name: Fetch first image from each Shopee product page
        run: python scripts/sync_shopee_images.py
      - name: Commit synced product covers
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/products || true
          if git diff --cached --quiet; then
            echo 'No image changes to commit'
          else
            git commit -m 'Sync Shopee single-product cover images'
            git push
          fi
